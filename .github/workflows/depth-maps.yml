# Makes a depth map for every new photo (for the photo-based 3D experience)
# and commits them back. Runs when photos change, or by hand from the
# Actions tab ("Run workflow").
name: Depth maps

on:
  push:
    paths:
      - "public/photos/**.jpg"
      - "public/photos/**.jpeg"
      - "scripts/depth_maps.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: depth-maps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  depth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.45" pillow numpy
      - name: Make depth maps
        run: python scripts/depth_maps.py
      - name: Commit new depth maps
        run: |
          if [ -n "$(git status --porcelain public/photos/depth)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/photos/depth
            git commit -m "Depth maps for new photos"
            git push
          else
            echo "Nothing new."
          fi
