# Netlify configuration for the Lospikir site.
# Connect the repository in Netlify and these settings are picked up automatically.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Keep the CMS out of the SPA catch-all below.
[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200

# Single-page app: send unknown paths to index.html so client routing keeps working
# if pages are added later. Static assets are matched before this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
